[settings]
lockfile = true

[env]
LANG = "C.UTF-8"
LC_ALL = "C.UTF-8"
WFC_CORPUS = "default"
WFC_MAX_WORD = "1024"
WFC_TOP = "10"

[tools]
bun = "1.3.14"
cabal = "3.16.1.0"
clang = "22.1.8"
cmake = "4.3.4"
dotnet = "10.0.302"
elixir = "1.20.2-otp-29"
erlang = "29.0.3"
go = "1.26.5"
gofumpt = "0.10.0"
golangci-lint = "2.12.2"
godot = "4.7.1-stable"
gradle = "9.6.1"
ghcup = "0.2.6.2"
hlint = "3.10"
java = "26.0.2"
kotlin = "2.4.10"
ktlint = "1.8.0"
lua = "5.5.0"
lua-language-server = "3.18.2"
ninja = "1.13.2"
node = "26.5.0"
odin = "dev-2026-07a"
ormolu = "0.8.1.1"
php = "8.5.8"
prettier = "3.9.6"
python = ["3.14.6", "3.12.13"]
rebar = "3.27.0"
rust = "1.97.1"
shellcheck = "0.11.0"
shfmt = "3.13.1"
stylua = "2.5.2"
taplo = "0.10.0"
uv = "0.11.32"
zig = "0.16.0"
"cargo:cargo-deny" = "0.20.2"
"conda:clang-tools" = "22.1.8"
"conda:clangxx" = "22.1.8"
"conda:findent" = "4.3.7"
"conda:flang" = "22.1.8"
"conda:ford" = "7.0.13"
"conda:fortls" = "3.2.2"
"conda:fpm" = "0.13.0"
"conda:gfortran" = "15.2.0"
"github:alire-project/alire" = { version = "2.1.1", exe = "alr" }
"github:composer/composer" = "2.10.2"
"go:github.com/KrishRVH/boringlint/cmd/boringlint" = { version = "0.9.5", depends = "go" }
"go:golang.org/x/vuln/cmd/govulncheck" = "1.6.0"

[tools."http:odinfmt"]
version = "nightly"
url = 'https://github.com/DanielGavin/ols/releases/download/{{ version }}/ols-{{ arch(x64="x86_64") }}-{{ os(macos="darwin", linux="unknown-linux-gnu", windows="pc-windows-msvc") }}.zip'
checksum_url = "https://api.github.com/repos/DanielGavin/ols/releases/tags/{{ version }}"
checksum_expr = 'filter(fromJSON(body).assets, { #.name == filename })[0].digest'
rename_exe = "odinfmt"

[tools."http:roc"]
version = "nightly-2026-July-25-b6cdced"
checksum_url = "https://api.github.com/repos/roc-lang/nightlies/releases/tags/{{ version }}"
checksum_expr = 'filter(fromJSON(body).assets, { #.name == filename })[0].digest'

[tools."http:roc".platforms]
linux-arm64 = { url = "https://github.com/roc-lang/nightlies/releases/download/nightly-2026-July-25-b6cdced/roc_nightly-linux_arm64-2026-07-25-b6cdced.tar.gz" }
linux-x64 = { url = "https://github.com/roc-lang/nightlies/releases/download/nightly-2026-July-25-b6cdced/roc_nightly-linux_x86_64-2026-07-25-b6cdced.tar.gz" }
macos-arm64 = { url = "https://github.com/roc-lang/nightlies/releases/download/nightly-2026-July-25-b6cdced/roc_nightly-macos_apple_silicon-2026-07-25-b6cdced.tar.gz" }
macos-x64 = { url = "https://github.com/roc-lang/nightlies/releases/download/nightly-2026-July-25-b6cdced/roc_nightly-macos_x86_64-2026-07-25-b6cdced.tar.gz" }
windows-x64 = { url = "https://github.com/roc-lang/nightlies/releases/download/nightly-2026-July-25-b6cdced/roc_nightly-windows_x86_64-2026-07-25-b6cdced.zip" }

[tasks.install]
description = "Install pinned project tools"
run = "mise install"

[tasks.tasks]
description = "List available project tasks"
run = "mise tasks"

[tasks.fmt]
description = "Format all maintained sources"
run = """
clang_format="$(mise where conda:clang-tools)/bin/clang-format"
"$clang_format" -i c/src/*.c cpp/src/*.cpp
cargo fmt --manifest-path rust/Cargo.toml --all
(cd go && gofumpt -w .)
prettier --write --cache --list-different README.md scripts/*.ts
(cd javascript && bun install --frozen-lockfile && bun run format:fix)
(cd typescript && bun install --frozen-lockfile && bun run format)
(cd gdscript && uv sync --locked --python 3.12.13 && uv run gdformat src)
odinfmt -path:odin/src -config:odin/odinfmt.json -w
(cd python && uv sync --locked && uv run ruff format .)
roc fmt roc/main.roc roc/Project.roc
shfmt -w -i 2 -ci shell/*.bash
composer_phar="$(mise where github:composer/composer)/composer.phar"
(cd php && php "$composer_phar" install --quiet --no-interaction && php "$composer_phar" normalize && php "$composer_phar" fmt)
stylua_bin="$(mise where stylua)/stylua"
"$stylua_bin" --config-path lua/stylua.toml lua
dotnet format csharp/src/WordFrequencyCounter/WordFrequencyCounter.csproj
ktlint -F 'kotlin/**/*.kt' 'kotlin/**/*.kts'
(cd elixir && mix format)
ormolu --mode inplace haskell/app/Main.hs
mkdir -p build/check
findent -i3 -Rr < fortran/src/main.f90 > build/check/main.f90
mv build/check/main.f90 fortran/src/main.f90
findent -i3 -Rr < fortran/app/main.f90 > build/check/main-app.f90
mv build/check/main-app.f90 fortran/app/main.f90
(cd spark && alr -n exec -- gnatformat -P word_frequency_counter_spark.gpr -U --charset=utf-8 --width=79 --indentation=3)
zig fmt zig/build.zig zig/build.zig.zon zig/src/*.zig
taplo format .config/mise/config.toml
"""

[tasks."fmt:check"]
description = "Check formatting"
run = """
clang_format="$(mise where conda:clang-tools)/bin/clang-format"
"$clang_format" --dry-run --Werror c/src/*.c cpp/src/*.cpp
cargo fmt --manifest-path rust/Cargo.toml --all -- --check
(cd go && test -z "$(gofumpt -l .)")
prettier --check README.md scripts/*.ts
(cd javascript && bun install --frozen-lockfile && bun run format:check)
(cd typescript && bun install --frozen-lockfile && bun run format:check)
(cd gdscript && uv sync --locked --python 3.12.13 && uv run gdformat --check src)
for file in odin/src/*.odin; do
  odinfmt -stdin -config:odin/odinfmt.json < "$file" | head -n -1 | cmp -s "$file" - || {
    echo "Odin source is not formatted: $file" >&2
    exit 1
  }
done
(cd python && uv sync --locked && uv run ruff format --check .)
roc fmt --check roc/main.roc
roc fmt --check roc/Project.roc
shfmt -d -i 2 -ci shell/*.bash
composer_phar="$(mise where github:composer/composer)/composer.phar"
(cd php && php "$composer_phar" install --quiet --no-interaction && php "$composer_phar" normalize:check && php "$composer_phar" phpcs)
stylua_bin="$(mise where stylua)/stylua"
"$stylua_bin" --config-path lua/stylua.toml --check lua
dotnet format csharp/src/WordFrequencyCounter/WordFrequencyCounter.csproj --verify-no-changes
ktlint 'kotlin/**/*.kt' 'kotlin/**/*.kts'
(cd elixir && mix format --check-formatted)
ormolu --mode check haskell/app/Main.hs
mkdir -p build/check
findent -i3 -Rr < fortran/src/main.f90 > build/check/main.f90
cmp -s fortran/src/main.f90 build/check/main.f90
findent -i3 -Rr < fortran/app/main.f90 > build/check/main-app.f90
cmp -s fortran/app/main.f90 build/check/main-app.f90
(cd spark && alr -n exec -- gnatformat --check -P word_frequency_counter_spark.gpr -U --charset=utf-8 --width=79 --indentation=3)
zig fmt --check zig/build.zig zig/build.zig.zon zig/src/*.zig
taplo format --check .config/mise/config.toml
"""

[tasks.lint]
description = "Run static checks without executing correctness tests"
run = """
cmake --fresh --preset clang
cmake --build --preset clang
clang_tidy_resource="$(mise where conda:clangxx)/lib/clang/22"
clang-tidy --extra-arg=-resource-dir="$clang_tidy_resource" c/src/wordcount.c cpp/src/main.cpp -p build/c/clang
(cd rust && cargo check --locked --all-targets --all-features && cargo clippy --locked --all-targets --all-features -- -D warnings && RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps && cargo deny check)
(cd go && go mod tidy -diff && go mod verify && go vet ./... && boringlint ./... && golangci-lint run ./... && govulncheck ./...)
(cd javascript && bun install --frozen-lockfile && bun run lint:check && bun run typecheck && node --check src/wordcount.js)
(cd typescript && bun install --frozen-lockfile && bun run standards:check)
(cd gdscript && uv sync --locked --python 3.12.13 && uv run gdlint src && godot --headless --no-header --path . --check-only --script src/wordcount.gd)
odin check odin/src -vet -vet-style -vet-tabs -vet-using-param -strict-style -disallow-do -warnings-as-errors
(cd python && uv sync --locked && uv run ruff check . && uv run basedpyright --warnings && uv run bandit -c pyproject.toml -r src && uv audit --preview-features audit-command --locked)
roc check roc/main.roc --no-cache
shellcheck -x shell/*.bash
bash -n shell/*.bash
composer_phar="$(mise where github:composer/composer)/composer.phar"
(cd php && php "$composer_phar" install --quiet --no-interaction && php "$composer_phar" standards:check)
dotnet build csharp/src/WordFrequencyCounter/WordFrequencyCounter.csproj -warnaserror
(cd lua && mise x lua@5.4.8 -- sh -lc '
  if [ ! -x ../.lua_modules54/bin/luacheck ]; then
    luarocks --tree ../.lua_modules54 install luacheck
  fi
  eval "$(luarocks --tree ../.lua_modules54 path)"
  luacheck --exclude-files ../.lua_modules54/** -- .
')
lua-language-server --check=lua --checklevel=Error
(cd kotlin && JAVA_HOME="$(mise where java)" gradle --no-daemon --warning-mode=fail detektMain classes)
(cd elixir && mix deps.get --check-locked && mix format --check-formatted && MIX_ENV=test mix compile --warnings-as-errors && mix credo --strict && mix dialyzer && mix deps.unlock --check-unused && mix hex.audit && mix deps.audit && MIX_ENV=dev mix docs --warnings-as-errors)
hlint haskell/app
ghcup run --install --ghc 9.14.1 -- ghc -Wall -Werror -fno-code haskell/app/Main.hs
(cd haskell && cabal check && ghcup run --install --ghc 9.14.1 -- cabal build all --ghc-options=-Werror)
(cd fortran && fpm build --compiler gfortran --profile debug --flag "-std=f2018 -Wall -Wextra -Wimplicit-interface -Wimplicit-procedure -Wsurprising -Werror -pedantic -fcheck=all -fbacktrace" && fpm build --compiler gfortran --profile release --flag "-std=f2018 -Wall -Wextra -Wimplicit-interface -Wimplicit-procedure -Wsurprising -Werror -pedantic" && fortls --debug_rootpath . --debug_filepath src/main.f90 --debug_parser >/dev/null && fortls --debug_rootpath . --debug_filepath app/main.f90 --debug_parser >/dev/null && ford ford.md)
mkdir -p build/check/flang
flang-new -std=f2018 -pedantic -Werror -J build/check/flang -c fortran/src/main.f90 -o build/check/flang/main.o
flang-new -std=f2018 -pedantic -Werror -I build/check/flang -c fortran/app/main.f90 -o build/check/flang/app.o
(cd spark && test -f alire.toml && test -f word_frequency_counter_spark.gpr && test -f gnat.adc)
(cd spark && awk '
  /^\\[\\[depends-on\\]\\]/ { in_deps = 1; next }
  /^\\[/ { in_deps = 0 }
  in_deps && /^[[:space:]]*[[:alnum:]_][[:alnum:]_-]*[[:space:]]*=/ {
    value = substr($0, index($0, "=") + 1)
    gsub(/^[[:space:]]+|[[:space:]]+$/, "", value)
    if (value !~ /^"=[0-9][^"]*"$/) {
      print FILENAME ":" FNR ": dependency must use an exact =x.y.z constraint: " $0
      bad = 1
    }
  }
  END { exit bad }
' alire.toml)
(cd spark && ! find src -type f \\( -name '*.ads' -o -name '*.adb' \\) -print0 | xargs -0 grep -L 'SPARK_Mode' 2>/dev/null | grep -q .)
(cd spark && alr -n build --validation)
(cd spark && alr -n exec -- gnatprove -P word_frequency_counter_spark.gpr -U --mode=all --level=4 --warnings=error --checks-as-errors=on --pedantic --report=fail --output=oneline -j0)
(cd zig && zig build check --summary all && zig build -Doptimize=ReleaseSafe --summary all)
bun build scripts/bench.ts --target=bun --outfile=build/check/bench.js
"""

[tasks.build]
description = "Build all compiled implementations"
run = "bun scripts/bench.ts --build-only"

[tasks.validate]
description = "Validate implementations against tokenfreq-c99"
run = "bun scripts/bench.ts --validate --runs=1"

[tasks.bench]
description = "Build, validate, and benchmark implementations"
run = "bun scripts/bench.ts"

[tasks."check:local"]
description = "Run local format, lint, build, and oracle validation"
depends = ["fmt:check", "lint", "validate"]

[tasks.check]
description = "Alias for local checks"
depends = ["check:local"]

[tasks.clean]
description = "Remove generated build output"
run = "rm -rf build rust/target go/bin javascript/node_modules javascript/.tsbuildinfo typescript/node_modules typescript/.tsbuildinfo gdscript/.godot gdscript/.venv python/.venv php/vendor php/.phpstan.cache csharp/src/WordFrequencyCounter/bin csharp/src/WordFrequencyCounter/obj kotlin/.gradle kotlin/.kotlin kotlin/build elixir/_build elixir/deps elixir/doc elixir/word_count haskell/dist-newstyle fortran/build spark/config spark/alire/build_hash_inputs spark/alire/flags spark/alire/settings.toml .lua_modules .lua_modules54 .zig-cache zig/.zig-cache zig/zig-out zig-out"
